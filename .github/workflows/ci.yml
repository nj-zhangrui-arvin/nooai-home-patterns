name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse Python files without writing bytecode
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(
              path for path in Path(".").rglob("*.py") if "__pycache__" not in path.parts
          )
          if not files:
              print("No Python files found.")
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY
      - name: Run tests
        run: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Run public export gate when present
        run: |
          if [ -f tools/check_public_export.py ]; then
            if [ -f media-manifest.json ]; then
              env PYTHONDONTWRITEBYTECODE=1 python3 tools/check_public_export.py . --media-manifest media-manifest.json
            else
              env PYTHONDONTWRITEBYTECODE=1 python3 tools/check_public_export.py .
            fi
          else
            echo "No public export gate in this repository."
          fi
